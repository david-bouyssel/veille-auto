name: Publier la veille

on:
  push:
    branches: [main, "claude/**"]
    paths: ["data/editions/**", "scripts/**", "templates/**", "config/**", "vendor/**", ".github/workflows/publish.yml"]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # La routine cloud peut n'avoir le droit de pousser que sur une branche claude/*.
  # On fusionne alors cette branche dans main, puis on relance ce workflow sur main :
  # l'environnement github-pages n'accepte que les déploiements depuis main.
  merge:
    if: github.ref_name != 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fusionner dans main
        env:
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout main
          git merge --ff-only "origin/$BRANCH" || git merge --no-edit "origin/$BRANCH"
          git push origin main
          git push origin --delete "$BRANCH"
          gh workflow run publish.yml --ref main

  # Génération et déploiement dans deux jobs séparés, comme le recommande GitHub :
  # dans un seul job, deploy-pages cherchait parfois l'artefact avant qu'il soit visible
  # (« No artifacts named "github-pages" were found »).
  build:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # historique complet : la version se déduit du nombre de commits
      - name: Générer le site
        run: python3 scripts/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
